name: backend-ci

on:
  push:
    branches: [main]
    paths: ["backend/**", ".github/workflows/backend-ci.yml"]
  pull_request:
    paths: ["backend/**", ".github/workflows/backend-ci.yml"]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: nob_user
          POSTGRES_PASSWORD: nob_pass
          POSTGRES_DB: nob_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U nob_user -d nob_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://nob_user:nob_pass@localhost:5432/nob_test
      TEST_DATABASE_URL_SYNC: postgresql://nob_user:nob_pass@localhost:5432/nob_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt

      - name: Migrations round trip (upgrade, downgrade, upgrade) and drift check
        env:
          DATABASE_URL: postgresql+asyncpg://nob_user:nob_pass@localhost:5432/nob_test
          DATABASE_URL_SYNC: postgresql://nob_user:nob_pass@localhost:5432/nob_test
          SECRET_KEY: ci-only-secret-key-0123456789012345678901
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head
          alembic check

      - name: Tests
        run: python -m pytest -q
