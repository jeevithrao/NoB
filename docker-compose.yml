version: "3.9"

services:
  db:
    image: postgres:16
    container_name: nob_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: nob_user
      POSTGRES_PASSWORD: nob_password
      POSTGRES_DB: nob_db
    ports:
      - "5432:5432"
    volumes:
      - nob_db_data:/var/lib/postgresql/data

volumes:
  nob_db_data:
