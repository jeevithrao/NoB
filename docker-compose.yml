services:
  db:
    image: postgres:16
    container_name: nob_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-ethnowalk_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env (repo root)}
      POSTGRES_DB: ${DB_NAME:-NoB_db}
    # Port is NOT exposed to the host \u2014 only reachable by other Docker services.
    # To connect from the host machine for debugging, use:
    #   docker exec -it nob_db psql -U ethnowalk_user NoB_db
    volumes:
      - nob_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-ethnowalk_user} -d ${DB_NAME:-NoB_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nob_backend
    restart: unless-stopped
    env_file: ./backend/.env
    environment:
      - DATABASE_URL=postgresql+asyncpg://${DB_USER:-ethnowalk_user}:${DB_PASSWORD:?set DB_PASSWORD in .env (repo root)}@db:5432/${DB_NAME:-NoB_db}
      - DATABASE_URL_SYNC=postgresql://${DB_USER:-ethnowalk_user}:${DB_PASSWORD:?set DB_PASSWORD in .env (repo root)}@db:5432/${DB_NAME:-NoB_db}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend/media:/app/media
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status == 200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  nginx:
    image: nginx:alpine
    container_name: nob_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./backend/media:/app/media:ro
      # Mount SSL certs (provisioned externally via Let's Encrypt / certbot):
      #   docker run --rm -v nob_certs:/etc/letsencrypt certbot/certbot certonly ...
      # Uncomment and point to your cert paths once TLS is provisioned.
      - ${CERT_DIR:-./certs}:/etc/nginx/ssl:ro   # needs cert.pem + key.pem
      - /var/www/certbot:/var/www/certbot:ro
    depends_on:
      backend:
        condition: service_healthy

volumes:
  nob_db_data:
  # nob_certs:
