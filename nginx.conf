events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/m;

    # Redirect HTTP to HTTPS (except ACME challenge for Let's Encrypt)
    server {
        listen 80;
        server_name _;

        # Let's Encrypt / certbot ACME challenge path
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Redirect everything else to HTTPS
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # HTTPS server
    # To provision a cert with Let's Encrypt (after DNS is pointing here):
    #   certbot --nginx -d yourdomain.com
    # Or mount an existing cert via Docker volume and set paths below.
    # For local testing, generate a self-signed cert:
    #   openssl req -x509 -nodes -days 365 -newkey rsa:2048 \
    #     -keyout /etc/nginx/ssl/key.pem \
    #     -out /etc/nginx/ssl/cert.pem
    server {
        listen 443 ssl;
        server_name _;

        # Replace with real cert paths once TLS is provisioned.
        ssl_certificate     /etc/nginx/ssl/cert.pem;
        ssl_certificate_key /etc/nginx/ssl/key.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        location / {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://backend:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Signed media files served directly by nginx for performance.
        # Signature verification happens in FastAPI; nginx just adds caching headers.
        location /media/ {
            alias /app/media/;
            add_header Accept-Ranges bytes;
            # Short expiry (1h) because these are signed-URL responses \u2014
            # the client should not cache them beyond the signature TTL.
            expires 1h;
            add_header Cache-Control "public, no-transform";
        }
    }
}
